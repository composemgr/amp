# nginx proxy address - http://172.17.0.1:64107

name: amp
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: mitchtalmadge/amp-dockerized:latest
    container_name: amp-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: amp-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    ports:
      - '172.17.0.1:64107:8080'
    volumes:
      - './volumes/config/amp:/config'
      - './volumes/data/amp:/data'
    networks:
      - amp

networks:
  amp:
    name: amp
    external: false
